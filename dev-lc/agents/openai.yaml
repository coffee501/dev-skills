interface:
  display_name: "LC 生命周期治理"
  short_description: "Orchestrate backend development stages, unifying change tracking, baseline state, and cross-module handoffs | 编排后端研发阶段、统一变更追踪、基线状态和跨模块责任交接"
  default_prompt: "Use $dev-lc to route and govern an end-to-end backend change."
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
# Extension block: explicit orchestration declaration.
# Documented in dev-lc/references/output-contracts.md.
# OpenAI Agent Spec does not yet standardise a sub-agents field; this block
# is informational and consumed by the lifecycle governance policy itself.
orchestration:
  role: orchestrator
  stage_routing: true
  invalidation_authority: true
  downstream:
    - skill: dev-req
      stage: requirements
      role: producer
      artifact: REQ
    - skill: dev-ctx
      stage: discovery
      role: producer
      artifact: CTX
    - skill: dev-hld
      stage: architecture
      role: producer
      artifact: HLD/DEC
    - skill: dev-lld
      stage: detailed-design
      role: producer
      artifact: LLD/DDEC
    - skill: dev-impl
      stage: implementation
      role: producer
      artifact: IMP/BUILD
    - skill: dev-cr
      stage: review
      role: producer
      artifact: REV
      contract: read-only
    - skill: dev-test
      stage: test-design
      role: producer
      artifact: TC/AUT
    - skill: dev-val
      stage: validation
      role: producer
      artifact: RUN/EVD/GATE
      contract: read-only-on-target
    - skill: dev-rel
      stage: release
      role: producer
      artifact: REL
      contract: authorized-only
    - skill: dev-ops
      stage: operations
      role: producer
      artifact: OPS/INC/RCA/CAPA
      contract: authorized-only